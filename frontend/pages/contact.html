  <!-- Contacto -->
  <main class="flex-grow-1">
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <h2 class="text-center mb-4 text-primary">
              <i class="bi bi-envelope-fill"></i> Contáctanos
            </h2>
            <form id="contact-form" action="https://formsubmit.co/galinoalvaro@gmail.com" method="POST">
              <div class="mb-3">
                <label for="name" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Tu nombre completo">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com">
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Mensaje</label>
                <textarea class="form-control" id="message" name="message" rows="4"
                  placeholder="Escribe tu mensaje aquí..."></textarea>
              </div>
                <div class="mb-3" id="validation-feedback" style="color: red;"></div>
                <input type="hidden" name="_subject" value="Nuevo Mensaje de Contacto - WappTurno">
                <input type="hidden" name="_captcha" value="false">
              <div class="d-grid">
                <button type="submit" class="btn btn-primary" **id="submit-button" disabled**>
                  <i class="bi bi-send"></i> Enviar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->

    const logoutBtn = document.getElementById("logoutBtn");

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("login");
      window.location.href = "../index.html";
    });
  </script>
