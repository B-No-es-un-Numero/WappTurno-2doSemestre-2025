<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de inicio de sesión (Login) de WappTurno. Accede a tu cuenta para gestionar tus citas médicas.">
  <title>WappTurno</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">

</head>

<body class="d-flex flex-column min-vh-100">
  <main class=" d-flex justify-content-center align-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-lg p-4">
            <div class="card-body">
              <h1 class="text-center mb-4 text-primary">
                <i class="bi bi-calendar-check"></i> WappTurno
              </h1>
              <h2 class="text-center">Iniciar Sesión</h2>
              <p class="text-center text-secondary">Bienvenido nuevamente </p>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label fw-bold">Email</label>
                  <input type="email" class="form-control" id="email" value="" placeholder="tuemail@ejemplo.com"
                    required>
                  <div class="invalid-feedback">Por favor, ingresa un correo electrónico válido.</div>
                </div>

                <div class="mb-1">
                  <label for="password" class="form-label fw-bold">Contraseña</label>
                  <input type="password" class="form-control" id="password" value="" placeholder="******" required
                    minlength="6" maxlength="6">
                  <div class="invalid-feedback">La contraseña debe tener 6 caracteres e incluir números y letras.</div>
                </div>

                <div class="d-flex justify-content-end">
                  <div>
                    <button type="button" class="btn btn-link text-decoration-none">¿Olvidaste tu Contraseña?</button>

                  </div>


                </div>



                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
                </div>

                <div class="mt-4 d-flex align-items-center justify-content-center">
                  <span class="text-secondary">¿No tienes una cuenta?</span>
                  <a href="register.html"><button type="button" class="btn btn-link text-decoration-none px-1">Registrate</button></a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 mt-auto border-top">
    <p class="mb-0 text-secondary">&copy; 2025 - WappTurno - B no es un número</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>

  <!-- JS -->
  <script src="../js/login.js"></script>
</body>

</html>
