<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAPPTURNO</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
  <!-- CSS  -->
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Navbar  -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="../index.html">
        <i class="bi bi-calendar-check"></i> WappTurno
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">
              <i class="bi bi-arrow-left"></i>
              Volver
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5 mb-5 col-lg-6">
    <div class="card p-4 shadow-lg">
      <h3 class="text-center mb-4 fw-bold text-primary">Registro de Usuario</h3>
      <form id="registerForm" method="GET">
        <div class="mb-3">
          <label for="name" class="form-label text-primary">Nombre (*)</label>
          <input type="text" class="form-control" id="name" name="name" minlength="2" maxlength="30" required>
        </div>

        <div class="mb-3">
          <label for="name" class="form-label text-primary">Apellido (*)</label>
          <input type="text" class="form-control" id="surname" name="surname" minlength="2" maxlength="30" required>
        </div>

        <div class="mb-3">
          <label for="name" class="form-label text-primary">Documento Nacional de Identidad - DNI (*)</label>
          <input type="number" class="form-control" id="dni" name="dni" min="1000000" max="99999999" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label text-primary">Correo Electrónico (*)</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label text-primary">Contraseña (*)</label>
          <input type="password" class="form-control" id="password" name="password" minlength="6" maxlength="20"
            required>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label text-primary">Confirmar Contraseña (*)</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" minlength="6"
            maxlength="20" required>
        </div>

        <div id="alertContainer"></div>

        <div class="mb-3">
          <label for="email" class="form-label text-primary">(*) Campo obligatorio</label>
        </div>

        <div class="text-center"><button type="submit"
            class="btn btn-primary w-100 mt-2 placeholder-wave">Registrarse</button></div>
      </form>
    </div>
  </div>

  <footer class="bg-light text-center py-3 mt-auto border-top">
    <p class="mb-0 text-muted">&copy; 2025 - WappTurno - B no es un número</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>

  <!-- Script JS-->
  <script src="../js/register.js"></script>
</body>

</html>
